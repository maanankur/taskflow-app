# TASKFLOW - SCOPE DEFINITION
# ============================================================
# Read by the Context Wiremap Orchestrator's "scope" node, which fetches
# this file from this repo's ROOT via the GitHub API (see
# core/scope_definition.py). The scope -> requirement edge checks that every
# key listed under linked_requirements still exists as a real requirement,
