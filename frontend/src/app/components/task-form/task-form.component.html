<!-- TaskFlow - Task Form Component Template -->
<!-- JIRA Story: TFLOW-9 - [FE] Build Task Form component for create/edit -->

<div class="task-form-container">
  <div class="header-section">
    <h2>{{ isEditMode ? 'Edit Task' : 'Create New Task' }}</h2>
    <a routerLink="/tasks" class="btn btn-link">← Back to List</a>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="success-message">
    ✅ {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="error-message">
    ⚠️ {{ error }}
  </div>

  <!-- Loading -->
  <div *ngIf="loading$ | async" class="loading">
    <div class="spinner"></div>
  </div>

  <!-- Task Form -->
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
    <!-- Title -->
    <div class="form-group">
      <label for="title">Title *</label>
      <input 
        type="text" 
        id="title" 
        formControlName="title"
        placeholder="Enter task title"
        [class.is-invalid]="hasError('title', 'required') || hasError('title', 'minlength')"
      />
      <small *ngIf="hasError('title', 'required')" class="error-text">
        Title is required
      </small>
      <small *ngIf="hasError('title', 'minlength')" class="error-text">
        Title must be at least 3 characters
      </small>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea 
        id="description" 
        formControlName="description"
        placeholder="Enter task description (optional)"
        rows="4"
      ></textarea>
    </div>

    <div class="form-row">
      <!-- Status -->
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          <option *ngFor="let status of statusOptions" [value]="status">
            {{ status.replace('_', ' ') }}
          </option>
        </select>
      </div>

      <!-- Priority -->
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" formControlName="priority">
          <option *ngFor="let priority of priorityOptions" [value]="priority">
            {{ priority }}
          </option>
        </select>
      </div>

      <!-- Due Date -->
      <div class="form-group">
        <label for="due_date">Due Date</label>
        <input 
          type="date" 
          id="due_date" 
          formControlName="due_date"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="taskForm.invalid || (loading$ | async)"
      >
        {{ isEditMode ? 'Update Task' : 'Create Task' }}
      </button>
      
      <button 
        type="button" 
        class="btn btn-secondary"
        (click)="onCancel()"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
